openapi: 3.0.4
info:
  title: VIN Decoder
  description: >-
    VIN Decoder turns a 17-character Vehicle Identification Number into the
    vehicle it identifies. Returns make, model, year, trim, body class and
    manufacturer, plus engine specifications, plant of manufacture, and the
    safety equipment fitted to that specific build. Optionally adds every safety
    recall issued for that vehicle and its NHTSA 5-star crash-test rating.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/vindecoder:
    get:
      summary: VIN Decoder
      description: Decode a Vehicle Identification Number into the vehicle it identifies
      operationId: vindecoder
      parameters:
        - name: vin
          in: query
          schema:
            type: string
          required: true
          description: >-
            The Vehicle Identification Number to decode. Partial VINs are
            accepted and decode as far as the available characters allow.
          example: 1HGCM82633A004352
        - name: recalls
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Add the safety recalls NHTSA has issued for this vehicle's make,
            model and year.
          example: true
        - name: safetyRating
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Add the NHTSA 5-star crash-test rating for the closest tested
            version of this vehicle.
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  vin: 1HGCM82633A004352
                  valid: true
                  decoded: true
                  vehicleDescriptor: 1HGCM826*3A
                  make: HONDA
                  model: Accord
                  year: 2003
                  trim: EX-V6
                  trim2: null
                  series: null
                  series2: null
                  manufacturer: AMERICAN HONDA MOTOR CO., INC.
                  vehicleType: PASSENGER CAR
                  bodyClass: Coupe
                  plant:
                    state: OHIO
                    country: UNITED STATES (USA)
                    city: MARYSVILLE
                  engine:
                    displacementL: '2.998832712'
                    displacementCc: '2998.832712'
                    engineNumberOfCylinders: '6'
                    engineModel: J30A4
                    engineConfiguration: V-Shaped
                    engineBrakeHpFrom: '240'
                    displacementCi: '183'
                    fuelTypePrimary: Gasoline
                    valveTrainDesign: Single Overhead Cam (SOHC)
                  features:
                    passiveSafetySystem:
                      otherRestraintSystemInfo: Seat Belt (Rr center position)
                      seatBeltType: Manual
                      sideAirBagLocations: 1st Row (Driver and Passenger)
                      curtainAirBagLocations: 1st and 2nd Rows
                      frontAirBagLocations: 1st Row (Driver and Passenger)
                    exterior:
                      grossVehicleWeightRatingFrom: 'Class 1C: 4,001 - 5,000 lb (1,814 - 2,268 kg)'
                      grossVehicleWeightRatingTo: 'Class 1: 6,000 lb or less (2,722 kg or less)'
                      doors: '2'
                    mechanical:
                      transmissionStyle: Automatic
                      transmissionSpeeds: '5'
                  validation:
                    errorText: >-
                      0 - VIN decoded clean. Check Digit (9th position) is
                      correct
                    errorCode: '0'
                    errorCodes:
                      - '0'
                  recalls:
                    count: 13
                    doNotDrive: false
                    parkOutside: false
